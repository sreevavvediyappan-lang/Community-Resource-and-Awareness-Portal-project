<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications | CommunityConnect</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f8f6;
    color: #263238;
}

header {
    background: #176b4d;
    color: white;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
}

.container {
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #176b4d;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 30px;
}

.application {
    background: #f0f7f3;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.application h3 {
    color: #176b4d;
    margin-bottom: 8px;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 7px 12px;
    border-radius: 20px;
    background: #dff5e9;
    color: #176b4d;
    font-size: 13px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #176b4d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #12543c;
}
</style>
</head>

<body>

<header>
    <div class="logo">🌿 CommunityConnect</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<div class="container">

    <div class="card">

        <h1>My Applications</h1>

        <p class="subtitle">
            View and track your applications.
        </p>

        <div class="application">
            <h3>Educational Scholarship</h3>
            <p>Application submitted through CommunityConnect.</p>
            <span class="status">Submitted</span>
        </div>

        <div class="application">
            <h3>Community Support Program</h3>
            <p>Application status can be checked here.</p>
            <span class="status">Under Review</span>
        </div>

        <button onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDpm8pHtGj_6pTw_ltZqpbHDWuF1G7KgZ4",
    authDomain: "community-resourses.firebaseapp.com",
    projectId: "community-resourses",
    storageBucket: "community-resourses.firebasestorage.app",
    messagingSenderId: "556205954035",
    appId: "1:556205954035:web:90c48e1ba4b241bc1ab886",
    measurementId: "G-BSVB77GELT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// 🔐 Login protection
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | CommunityConnect</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            min-height: 100vh;
            color: #1f2937;
        }

        /* HEADER */

        .header {
            background: white;
            padding: 18px 7%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .logo-text h2 {
            color: #312e81;
            font-size: 22px;
        }

        .logo-text p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
        }

        .logout {
            border: none;
            background: #ef4444;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout:hover {
            opacity: 0.9;
        }

        /* MAIN */

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 22px;
            padding: 35px;

            box-shadow:
                0 12px 35px rgba(31, 41, 55, 0.12);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: auto;
            margin-bottom: 15px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
            font-weight: bold;
        }

        .profile-header h1 {
            color: #312e81;
            margin-bottom: 7px;
        }

        .profile-header p {
            color: #6b7280;
        }

        /* PROFILE INFORMATION */

        .section {
            margin-top: 25px;
        }

        .section h2 {
            color: #312e81;
            margin-bottom: 18px;
            font-size: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .info-box {
            background: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .info-box strong {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .info-box span {
            color: #111827;
            font-size: 15px;
        }

        .interests-box {
            background: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;

            line-height: 1.6;
        }

        /* BUTTONS */

        .actions {
            margin-top: 30px;

            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-button {
            flex: 1;
            min-width: 180px;

            padding: 13px;

            border-radius: 10px;

            text-align: center;
            text-decoration: none;

            font-weight: bold;
        }

        .primary {
            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;
        }

        .secondary {
            background: #eef2ff;
            color: #4338ca;
        }

        /* MESSAGE */

        .message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .profile-card {
                padding: 25px 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .logo-text h2 {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="navbar">

        <div class="logo">

            <div class="logo-icon">
                CC
            </div>

            <div class="logo-text">

                <h2>
                    CommunityConnect
                </h2>

                <p>
                    Connect. Discover. Empower.
                </p>

            </div>

        </div>


        <button
            class="logout"
            id="logoutButton">

            Logout

        </button>

    </div>

</header>



<main class="container">


    <div class="profile-card">


        <div class="profile-header">

            <div class="profile-icon" id="profileIcon">
                👤
            </div>

            <h1 id="profileName">
                My Profile
            </h1>

            <p id="profileEmail">
                Loading profile...
            </p>

        </div>



        <div class="section">

            <h2>
                Profile Information
            </h2>


            <div class="info-grid">


                <div class="info-box">

                    <strong>
                        Full Name
                    </strong>

                    <span id="name">
                        Loading...
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        Email
                    </strong>

                    <span id="email">
                        Loading...
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        Location
                    </strong>

                    <span id="location">
                        Loading...
                    </span>

                </div>



                <div class="info-box">

                    <strong>
                        Education
                    </strong>

                    <span id="education">
                        Loading...
                    </span>

                </div>


            </div>

        </div>



        <div class="section">

            <h2>
                My Interests
            </h2>


            <div
                class="interests-box"
                id="interests">

                Loading interests...

            </div>

        </div>



        <div class="actions">

            <a
                href="index.html"
                class="action-button primary">

                🏠 Back to Home

            </a>


            <a
                href="community.html"
                class="action-button secondary">

                🤝 Explore Community

            </a>

        </div>


        <div
            id="message"
            class="message">
        </div>


    </div>

</main>



<script type="module">

    /*
    ============================================
    FIREBASE CONNECTION
    ============================================

    We will connect Firebase in the next step.

    Do NOT enter your password here.
    */


    const logoutButton =
        document.getElementById("logoutButton");


    logoutButton.addEventListener(
        "click",
        function () {

            alert(
                "Firebase logout will be connected in the next step."
            );

        }
    );


</script>


</body>

</html>

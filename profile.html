<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | CommunityConnect</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f8f6;
    color: #263238;
}

header {
    background: #176b4d;
    color: white;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
}

.container {
    max-width: 700px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #176b4d;
    margin-bottom: 30px;
}

.info {
    background: #f0f7f3;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.info strong {
    display: block;
    color: #176b4d;
    margin-bottom: 7px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #176b4d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #12543c;
}
</style>
</head>

<body>

<header>
    <div class="logo">🌿 CommunityConnect</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<div class="container">

    <div class="card">

        <h1>My Profile</h1>

        <div class="info">
            <strong>Name</strong>
            <span id="userName">Loading...</span>
        </div>

        <div class="info">
            <strong>Email</strong>
            <span id="userEmail">Loading...</span>
        </div>

        <button id="logoutBtn">Logout</button>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDpm8pHtGj_6pTw_ltZqpbHDWuF1G7KgZ4",
    authDomain: "community-resourses.firebaseapp.com",
    projectId: "community-resourses",
    storageBucket: "community-resourses.firebasestorage.app",
    messagingSenderId: "556205954035",
    appId: "1:556205954035:web:90c48e1ba4b241bc1ab886",
    measurementId: "G-BSVB77GELT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// 🔐 Login protection
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("userEmail").textContent =
        user.email || "Not available";

    document.getElementById("userName").textContent =
        user.displayName || "CommunityConnect User";

});


// Logout
document.getElementById("logoutBtn").addEventListener("click", async () => {

    await signOut(auth);

    localStorage.removeItem("communityConnectLoggedIn");
    localStorage.removeItem("communityConnectUID");
    localStorage.removeItem("communityConnectEmail");

    window.location.href = "login.html";

});

</script>

</body>
</html>

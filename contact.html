<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | CommunityConnect</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f8f6;
    color: #263238;
}

header {
    background: #176b4d;
    color: white;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
}

nav a:hover {
    text-decoration: underline;
}

.container {
    max-width: 850px;
    margin: 50px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #176b4d;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #667085;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #176b4d;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #12543c;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #667085;
}
</style>
</head>

<body>

<header>
    <div class="logo">🌿 CommunityConnect</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="community.html">Community</a>
        <a href="government.html">Government</a>
        <a href="resources.html">Resources</a>
        <a href="awareness.html">Awareness</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<div class="container">

    <div class="card">

        <h1>Contact Us</h1>

        <p class="subtitle">
            Have a question or suggestion? Send us a message.
        </p>

        <form id="contactForm">

            <label for="name">Your Name</label>
            <input type="text" id="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="messageText">Message</label>
            <textarea id="messageText" required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <p id="message"></p>

    </div>

</div>

<footer>
    © 2026 CommunityConnect | Community Resource and Awareness Portal
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyDpm8pHtGj_6pTw_ltZqpbHDWuF1G7KgZ4",
    authDomain: "community-resourses.firebaseapp.com",
    projectId: "community-resourses",
    storageBucket: "community-resourses.firebasestorage.app",
    messagingSenderId: "556205954035",
    appId: "1:556205954035:web:90c48e1ba4b241bc1ab886",
    measurementId: "G-BSVB77GELT"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


// 🔐 Only logged-in users can access this page
onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
    }

});


// Contact form
document.getElementById("contactForm").addEventListener("submit", function(event) {

    event.preventDefault();

    document.getElementById("message").textContent =
        "✅ Thank you! Your message has been received.";

    document.getElementById("contactForm").reset();

});

</script>

</body>
</html>
